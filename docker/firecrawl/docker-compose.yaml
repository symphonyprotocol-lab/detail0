# Local Firecrawl for development. architecture.md 8.2: the rendered-page
# fallback for website sources. Point the app at it with
#   RENDER_PROVIDER=firecrawl
#   RENDER_PROVIDER_BASE_URL=http://localhost:3002
# in .env.local; no key -- authentication is off.
#
# Derived from firecrawl/firecrawl docker-compose.yaml (main, 2026-09-05) with
# the pre-built images where they are public and without the optional
# FoundationDB queue backend. Nothing here is persistent: the queue lives in
# NuQ Postgres and is disposable for local use.
#
#   docker compose -f docker/firecrawl/docker-compose.yaml up -d
#   curl -s http://localhost:3002/v2/scrape -H 'content-type: application/json' \
#     -d '{"url":"https://example.com","formats":["markdown"]}'
name: knowledge-market-firecrawl

services:
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    command: node dist/src/harness.js --start-docker
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      NUM_WORKERS_PER_QUEUE: 4
      CRAWL_CONCURRENT_REQUESTS: 5
      MAX_CONCURRENT_JOBS: 3
      BROWSER_POOL_SIZE: 2
      HARNESS_STARTUP_TIMEOUT_MS: 120000
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
    ports:
      - "${FIRECRAWL_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 4.0
    mem_limit: 4G
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      BLOCK_MEDIA: "true"
      MAX_CONCURRENT_PAGES: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 2G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging: *log

  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    logging: *log

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging: *log

  nuq-postgres:
    # ghcr.io/firecrawl/nuq-postgres is not public; the build context is a
    # copy of apps/nuq-postgres from the Firecrawl repository (postgres:17
    # with pg_cron and the queue schema).
    build: nuq-postgres
    image: knowledge-market-firecrawl/nuq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *log
