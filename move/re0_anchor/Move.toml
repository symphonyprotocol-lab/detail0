[package]
name = "re0_anchor"
version = "1.0.0"
license = "Apache-2.0"
authors = ["Symphony Protocol Lab"]

# aptos-anchoring-proposal.md 0.2: no upgrade capability at all.
#
# 1.3 waived the separate upgrade authority and the inspector, which left one
# key in an environment variable able to sign anchors, rewrite this module and
# take the code object away, with nothing responsible for noticing. Removing
# the upgrade capability removes all three at once: an immutable package cannot
# be rewritten, and it does not matter who owns an object nobody can publish to.
#
# The price is real and is not a detail. The signer address is bound at compile
# time, so rotating it was an upgrade -- and now it cannot be. Recovering from
# a stolen key means publishing a NEW code object, pointing the environment at
# it, and anchoring afresh; anchors made under the old object stay valid, so a
# verifier ends up holding a set of code objects as well as a set of signer
# addresses. A defect in this module has the same remedy and no other.
#
# Aptos only lets a policy get stricter, so this is one-way. It binds the first
# publish of any new object, mainnet included; the testnet object deployed
# before this change keeps `compatible` because a published policy cannot be
# changed from here.
upgrade_policy = "immutable"

[addresses]
# The Code Object address, filled in by `aptos move deploy-object
# --address-name re0_anchor`. Not knowable before the first deploy.
re0_anchor = "_"
# The Anchor Signer, the only account allowed to submit a batch. Bound at
# compile time on purpose: it is not stored on chain, so a stolen signer key
# cannot re-point it, and rotating it takes the offline Upgrade Authority
# (proposal 4.6). Pass it with --named-addresses on every build and deploy.
anchor_signer = "_"

[dev-addresses]
re0_anchor = "0xA11CE"
anchor_signer = "0x51611E4"

# Pinned to an exact commit rather than to a moving branch: proposal 4.11 gate 3
# is an internal review of the bytecode that goes to mainnet, and a review is
# only worth something if the same sources rebuild to the same artifact. This is
# the framework-only mirror of what mainnet runs -- the full aptos-core tree
# needs git-lfs and a several-GB clone for nothing we use here.
[dependencies.AptosFramework]
git = "https://github.com/aptos-labs/aptos-framework.git"
rev = "04611dd2cec1f5b7ef21c2cc151e05c587a2ce19"
subdir = "aptos-framework"
